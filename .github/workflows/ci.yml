name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    # DATA-CI-GATES（2026-11-13）：真起 PG，让 24 条 DB 门控用例以 PASS 出现（此前一律 skip）。
    # service 容器由 GitHub 在 runner 上映射到 127.0.0.1:5432；库名以 `_test` 结尾，
    # 与测试代码的硬约束一致（`internal/schema` / `internal/sync` 只认 `*_test` 库）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tellurion_data_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 两套门控变量都要：schema / 租约腿读 DATA_TEST_DSN；store / 作业终态腿读 DATABASE_URL
      # （`internal/store/write_pg_test.go`、`internal/sync/sync_test.go`）。二者都指向同一个
      # **临时 CI 测试库**，绝不指向任何部署库。
      DATA_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion_data_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tellurion_data_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门。govulncheck 按“符号级可达性”判定，
      # 只对真正被调用到的漏洞报红；破坏验证见本仓台账（降 kit/pgx 复红）。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # 迁移入口：本仓没有独立的 migrate 命令。唯一 DDL owner 是
      # `internal/schema.Statements()`，各 PG 套件在连接时自行应用它——
      # `internal/store/*_pg_test.go` 把 `market.` 前缀换成随机临时 schema；
      # `internal/schema/*_pg_test.go` 建临时 schema；`internal/sync` 的
      # `TestPGStoreFinishJobWritesTerminalState` / `openLeaseTestPG` 对测试库
      # 执行幂等 DDL。因此 CI 不额外跑外部迁移脚本，也不复制 core 的工具：
      # 测试自身就是唯一合法入口，真实行为以测试代码为准。
      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out

      # DATA-CI-GATES 覆盖率门（阈值来源见 AGENTS.md §2）：
      # 2026-11-13 在本机隔离 PG 16 上真跑全套件的 total = 58.9%，
      # 四舍五入取整 59，减 5 点 ⇒ 门 54%。低于阈值即红。
      - name: Coverage gate
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "total statement coverage: ${total}% (floor 54%)"
          awk -v t="${total}" -v f="54" 'BEGIN { if (t + 0 < f + 0) { printf "FAIL: coverage %.1f%% is below floor %d%%\n", t, f; exit 1 } }'

      # X-CI-RACE-STATICCHECK：竞态门。ubuntu-latest 自带 gcc，cgo 可用。
      - name: Test（-race）
        run: go test -race ./... -count=1

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
