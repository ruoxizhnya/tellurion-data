# tellurion-data · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 自带 PostgreSQL；要连外部库用 DATA_DATABASE_URL 覆盖。
name: tellurion-data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tellurion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tellurion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  data:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion-data:dev
    command: ["-addr", "0.0.0.0:8081"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: ${DATA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable}
      DATA_MARKET_SCHEMA: market
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
