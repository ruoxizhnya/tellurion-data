# tellurion-data · 单仓本地运行（ADR-036 G0）
# 用法：docker compose -f deploy/compose.yaml up --build
# 自带 PostgreSQL；要连外部库用 DATA_DATABASE_URL 覆盖。
name: tellurion-data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tellurion
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tellurion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  data:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tellurion/data:${DATA_IMAGE_TAG:-latest}
    command: ["-addr", "0.0.0.0:8081"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: ${DATA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable}
      DATA_MARKET_SCHEMA: market
      # 凭证来源（QT-77）：data 是**验签方**，只需要共享 JWT_SECRET，不持有任何
      # *_TOKEN；签发/轮换口径见 tellurion:docs/SPEC.md 的「服务间凭证」节。
      # 不设默认值：缺 secret 时落到第 2 态（读面公开、写面 503 auth_unavailable），
      # 而不是用仓库里公开的字符串当签名密钥。需要写面/全闸时从环境或 .env 注入。
      JWT_SECRET: ${JWT_SECRET:-}
      # 本地要恢复无 secret 的开放写面时，在环境或 .env 显式声明
      # AUTH_INSECURE_EXPOSURE=loopback-published；缺省空 ⇒ 第 2 态（写锁定）。
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
